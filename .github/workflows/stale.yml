# This workflow marks issues and PRs as stale when they have had no activity for a specified amount of time.
#
# You can adjust the behavior by modifying this file.
# For more information, see:
# https://github.com/actions/stale
name: Mark stale issues and pull requests

on:
  schedule:
  - cron: '30 1 * * *'

jobs:
  stale:

    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
    - uses: actions/stale@v11
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        stale-issue-message: >
          This issue has been automatically marked as stale because it has had no activity for 30 days.
          It will not be closed. If it is still relevant, please leave a comment with any new details
          (IDE version, plugin version, steps to reproduce) and the stale label will be removed.
        stale-pr-message: >
          This pull request has been automatically marked as stale because it has had no activity for 30 days.
          It will not be closed. If you are still working on it, please push an update or leave a comment
          and the stale label will be removed.
        stale-issue-label: 'no-issue-activity'
        stale-pr-label: 'no-pr-activity'
        days-before-stale: 30
        # Only label stale issues and PRs; never close them automatically
        days-before-close: -1
